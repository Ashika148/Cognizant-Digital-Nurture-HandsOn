<h2>Course List</h2>

<input [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" placeholder="Search courses...">

<p *ngIf="isLoading$ | async">Loading courses...</p>

<p *ngIf="error$ | async as error" class="error-message">
  {{ error }}
</p>

<div *ngIf="!(isLoading$ | async) && !(error$ | async)">
  <ng-container *ngIf="(courses$ | async) as courses">
    <ng-container *ngIf="courses.length > 0; else noCourses">
      <app-course-card
        *ngFor="let course of courses; let i = index; trackBy: trackByCourseId"
        [course]="course">
      </app-course-card>
    </ng-container>
    <ng-template #noCourses>
      <p>No courses available.</p>
    </ng-template>
  </ng-container>
</div>
